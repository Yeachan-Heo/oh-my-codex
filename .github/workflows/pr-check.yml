name: PR Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  size-label:
    name: PR Size Label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { additions, deletions } = context.payload.pull_request;
            const total = additions + deletions;

            let label;
            if (total < 50) label = 'size/S';
            else if (total < 200) label = 'size/M';
            else if (total < 500) label = 'size/L';
            else label = 'size/XL';

            const existing = context.payload.pull_request.labels
              .map(l => l.name)
              .filter(n => n.startsWith('size/'));

            for (const old of existing) {
              if (old !== label) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: old,
                });
              }
            }

            if (!existing.includes(label)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            }

            core.notice(`PR size: ${total} changes (${additions}+, ${deletions}-) → ${label}`);

  draft-check:
    name: Draft Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.payload.pull_request.draft) {
              core.notice('This PR is still in draft state.');
            }

  base-branch-guidance:
    name: PR Base Guidance
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Remind contributors to target dev for normal contributions
        run: |
          message='Normal contributions should target `dev`. If this PR was opened against `main` by accident, please retarget it to `dev`. Maintainer-directed `main` PRs are still allowed.'
          echo "::warning title=Retarget normal PRs to dev::$message"
          {
            echo '## PR base guidance'
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"

  cursor-drift-gate:
    name: Cursor Drift Gate
    # Must run on pull_request (head code available), not on pull_request_target.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse change slug from PR body
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          BODY="${{ github.event.pull_request.body }}"
          SLUG="$(echo "$BODY" | sed -n 's#.*openspec/changes/\([^/]*\)/.*#\1#p' | head -n1)"
          if [[ -z "$SLUG" ]]; then
            echo "Cannot parse change slug from PR body."
            echo "Use template field: Change Path: \`openspec/changes/<change-slug>/\`"
            exit 1
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Drift check
        shell: bash
        run: |
          chmod +x scripts/check-drift.sh
          ./scripts/check-drift.sh "${{ steps.parse.outputs.slug }}"

      - name: Cursor adapter assets check
        shell: bash
        run: |
          test -f adapters/cursor/control-plane.md
          test -f adapters/cursor/model-routing.yaml
          test -f .cursor/rules/global.mdc
          test -f .cursor/rules/backend-api-design.mdc
          test -f openspec/config.yaml
